name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main/source, master]

permissions:
  contents: read

jobs:
  build-android:
    name: Build offline Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;27.1.12297006

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check project
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Ensure Android wrapper is executable
        run: chmod +x android/gradlew

      - name: Configure Android SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > android/local.properties

      - name: Build release APK
        working-directory: android
        env:
          CI: true
          NODE_ENV: production
          NODE_OPTIONS: --max-old-space-size=2048
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuel-station-offline-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
